appId: com.openai.codex.desktop
productName: Codex Desktop
protocols:
  - name: Codex
    schemes:
      - codex
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/codex-package
    to: codex-package
    filter:
      - "**/*"
mac:
  artifactName: Codex-Desktop-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  extendInfo:
    NSMicrophoneUsageDescription: Codex Desktop uses the microphone only when you start voice dictation.
  electronLanguages:
    - en-US
  hardenedRuntime: true
  forceCodeSigning: true
  notarize: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  icon: resources/icon.png
  target:
    - dmg
    - zip
win:
  artifactName: Codex-Desktop-${version}-${arch}.${ext}
  forceCodeSigning: true
  icon: resources/icon.png
  signExts:
    - .dll
    - .exe
  target:
    - nsis
linux:
  artifactName: Codex-Desktop-${version}-${arch}.${ext}
  category: Development
  icon: resources/icon.png
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish: null
