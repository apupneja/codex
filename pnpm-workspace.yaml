packages:
  - codex-cli
  - codex-rs/responses-api-proxy/npm
  - desktop-app
  - sdk/typescript

ignoredBuiltDependencies:
  - esbuild

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Security fix for GHSA-2v37-7h3g-55p8; the root resolution pins 3.3.17.
  - nanoid

blockExoticSubdeps: true
strictDepBuilds: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude: []
allowBuilds:
  # Build only the official MCP conformance CLI pinned by the TypeScript SDK.
  "@modelcontextprotocol/conformance": true
  electron: true
  electron-winstaller: true
